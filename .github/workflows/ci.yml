name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_conformance:
        description: Analyze all vendor files (otherwise sample 100)
        type: boolean
        default: false
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo xtask generate-docs --check
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask test-corpus
  conformance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --workspace
      - run: cargo xtask fetch-conformance
      - run: python -m pip install -r tools/conformance-requirements.txt
      - run: python -m pip install --no-deps --no-build-isolation tests/external/cache/SVDSuite
      - run: cargo xtask test-conformance --suite SVDSuite --limit 0
      - run: python -m pytest tests/external/cache/SVDSuite/tests -q
      - run: cargo xtask test-conformance --suite data --limit ${{ inputs.full_conformance && '0' || '100' }}
      - run: cargo run --manifest-path tools/xsd-spike/Cargo.toml -- tests/external/cache/svd-schema/schemas > tests/external/reports/xsd-spike.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-reports
          path: tests/external/reports/

