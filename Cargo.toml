[workspace]
resolver = "3"
members = ["crates/svd-lint-core", "crates/svd-lint-cli", "tools/xtask"]
exclude = ["tools/xsd-spike", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
svd-lint-core = { path = "crates/svd-lint-core" }

svd-parser = { version = "0.14", features = ["expand"] }
svd-rs = { version = "0.14", features = ["serde", "derive-from"] }
roxmltree = "0.21"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }

insta = { version = "1", features = ["filters"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
